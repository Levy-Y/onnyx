<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Onnyx — Script Runner</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --bg:         #0e0e0e;
    --surface:    #161616;
    --border:     #2a2a2a;
    --text:       #c8c8c8;
    --text-dim:   #5a5a5a;
    --accent:     #00e5cc;
    --accent-dim: #00b8a6;
    --red:        #ff4444;
    --radius:     6px;
    --font-mono:  'SF Mono', 'Fira Code', 'Consolas', monospace;
  }

  html {
    font-size: 16px;
    -webkit-text-size-adjust: 100%;
  }

  body {
    background:      var(--bg);
    color:           var(--text);
    font-family:     var(--font-mono);
    min-height:      100vh;
    line-height:     1.5;
    -webkit-font-smoothing: antialiased;
  }

  .shell {
    max-width: 560px;
    margin:    0 auto;
    padding:   24px 16px 48px;
  }

  .header {
    display:         flex;
    align-items:     center;
    justify-content: space-between;
    margin-bottom:   32px;
  }

  .header__brand {
    display:     flex;
    align-items: center;
    gap:         10px;
  }

  .header__icon {
    width:  28px;
    height: 28px;
  }

  .header__title {
    font-size:      20px;
    font-weight:    700;
    letter-spacing: 4px;
    color:          var(--accent);
    text-transform: uppercase;
  }

  .header__status {
    font-size:      11px;
    color:          var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .btn-refresh {
    display:         flex;
    align-items:     center;
    gap:             6px;
    background:      transparent;
    border:          1px solid var(--border);
    color:           var(--text-dim);
    font-family:     var(--font-mono);
    font-size:       11px;
    letter-spacing:  1px;
    text-transform:  uppercase;
    padding:         8px 12px;
    border-radius:   var(--radius);
    cursor:          pointer;
    transition:      border-color 0.15s, color 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-refresh:hover,
  .btn-refresh:active {
    border-color: var(--accent);
    color:        var(--accent);
  }

  .btn-refresh svg {
    width:  13px;
    height: 13px;
  }

  .list {
    display:        flex;
    flex-direction: column;
    gap:            1px;
  }

  .list__item {
    display:         flex;
    align-items:     center;
    justify-content: space-between;
    background:      var(--surface);
    border:          1px solid var(--border);
    border-radius:   var(--radius);
    padding:         14px 14px 14px 18px;
    gap:             12px;
    transition:      border-color 0.15s;
  }

  .list__item:hover {
    border-color: #333;
  }

  .list__meta {
    min-width: 0;
    flex:      1;
  }

  .list__name {
    font-size:     14px;
    font-weight:   500;
    color:         var(--text);
    white-space:   nowrap;
    overflow:      hidden;
    text-overflow: ellipsis;
  }

  .list__size {
    font-size:  11px;
    color:      var(--text-dim);
    margin-top: 2px;
  }

  .btn-run {
    flex-shrink:     0;
    background:      var(--accent);
    color:           #0e0e0e;
    border:          none;
    font-family:     var(--font-mono);
    font-size:       11px;
    font-weight:     700;
    letter-spacing:  1.5px;
    text-transform:  uppercase;
    padding:         9px 18px;
    border-radius:   var(--radius);
    cursor:          pointer;
    transition:      background 0.15s, transform 0.08s;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-run:hover {
    background: var(--accent-dim);
  }

  .btn-run:active {
    transform: scale(0.95);
  }

  .empty {
    text-align:     center;
    color:          var(--text-dim);
    font-size:      12px;
    padding:        48px 0;
    letter-spacing: 0.5px;
  }

  .footer {
    margin-top:     40px;
    text-align:     center;
    font-size:      10px;
    color:          var(--text-dim);
    letter-spacing: 1px;
  }

  @media (max-width: 380px) {
    .shell          { padding-top: 16px; }
    .header         { margin-bottom: 24px; }
    .list__item     { padding: 12px 10px 12px 14px; }
    .btn-run        { padding: 9px 14px; }
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.5px;
    padding: 12px 20px;
    border-radius: var(--radius);
    opacity: 0;
    transition: transform 0.25s ease, opacity 0.25s ease;
    z-index: 100;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
    pointer-events: none;
  }

  .toast--visible {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  .list__empty {
    color:          var(--text-dim);
    font-size:      12px;
    letter-spacing: 0.5px;
    text-align:     center;
    padding:        32px 0;
    display:        none;
  }

  .list__empty--visible {
    display: block;
  }
</style>
<script>
  function fetch_scripts() {
    return fetch("http://192.168.71.1:80/scripts", {
      method: "GET",
    }).then(res => res.json())
      .then(data => {
        if (data != null) {
          return data;
        } else {
          return [];
        }
      }).catch(err => {
        console.log(`There was an error while executing the action: ${err}`)
        return [];
      })
  }

  function execute_script(script_name) {
    fetch("http://192.168.71.1:80/scripts", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({"name": script_name})
    }).then(res => {
      if (res.status !== 204) {
        notify("There was an error while executing the action.");
      } else if (res.status === 204) {
        notify(`Executing script: ${script_name}`)
      }
    })
  }

  function notify(message, duration = 3000) {
    const toast = document.createElement("div");
    toast.className = "toast";
    toast.textContent = message;
    document.body.appendChild(toast);

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        toast.classList.add("toast--visible");
      });
    });

    setTimeout(() => {
      toast.classList.remove("toast--visible");
      toast.addEventListener("transitionend", () => toast.remove());
    }, duration);
  }

  function load_scripts(scripts) {
    const script_list = document.getElementById("script_list");

    if (scripts == null || scripts.length === 0) {
      let empty_list_item = document.createElement("div");
      empty_list_item.className = "list__empty list__empty--visible";
      empty_list_item.textContent = "No scripts found.";
      script_list.appendChild(empty_list_item);
      return;
    }

    scripts.forEach(script => {
      const item = document.createElement("div");
      item.className = "list__item";
      item.innerHTML = `
        <div class="list__meta">
            <div class="list__name">${script.name}</div>
            <div class="list__size">${script.size} MB</div>
        </div>
        <button class="btn-run" onclick="execute_script('${script.name}')">Run</button>
      `;
      script_list.appendChild(item);
    });
  }

  addEventListener("load", _ => {
    fetch_scripts().then(scripts => {
      load_scripts(scripts);
    });
  });
</script>
</head>
<body>

<div class="shell">

  <header class="header">
    <div class="header__brand">
      <svg class="header__icon" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="9" y="2" width="10" height="6" rx="1.5" stroke="#00e5cc" stroke-width="1.5" fill="none"/>
        <rect x="11" y="4" width="2" height="2" fill="#00e5cc"/>
        <rect x="15" y="4" width="2" height="2" fill="#00e5cc"/>
        <line x1="14" y1="8" x2="14" y2="14" stroke="#00e5cc" stroke-width="1.5" stroke-linecap="round"/>
        <rect x="4" y="14" width="20" height="10" rx="2" stroke="#00e5cc" stroke-width="1.5" fill="none"/>
        <rect x="7" y="17" width="3" height="4" rx="0.75" fill="#00e5cc" opacity="0.4"/>
        <rect x="12.5" y="17" width="3" height="4" rx="0.75" fill="#00e5cc" opacity="0.4"/>
        <rect x="18" y="17" width="3" height="4" rx="0.75" fill="#00e5cc" opacity="0.6"/>
      </svg>
      <span class="header__title">ONNYX</span>
    </div>
    <span class="header__status">ESP32-S3</span>
  </header>

  <a href="" class="btn-refresh">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13.5 8a5.5 5.5 0 1 1-1.5-3.8"/>
      <polyline points="10,2 13.5,5.5 10,9"/>
    </svg>
    Refresh
  </a>

  <div style="margin-top: 20px;">
    <div class="list" id="script_list">
      <!--   Populated dynamically   -->
    </div>
  </div>

  <div class="footer">v0.1 — ONNYX FIRMWARE</div>
</div>

</body>
</html>
